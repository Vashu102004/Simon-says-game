

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="icon" type="image/png" href="https://p1.hiclipart.com/preview/138/573/156/simon-area-game-simon-says-smile-smiley-circle-symbol-png-clipart.jpg">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-box">
        <img class="logo"
            src="https://p1.hiclipart.com/preview/138/573/156/simon-area-game-simon-says-smile-smiley-circle-symbol-png-clipart.jpg"
            alt="Game Logo">

        <h1 class="title">SIMON SAYS</h1>
        <h2>Press any key to start</h2>

        <div class="score-board">
            <p>Level: <span id="current-level">0</span></p>
            <p>Best: <span id="best-score">0</span></p>
        </div>

        <div class="btn-container">
            <div class="line-one">
                <div class="btn red" type="button" id="red"></div>
                <div class="btn yellow" type="button" id="yellow"></div>
            </div>
            <div class="line-two">
                <div class="btn green" type="button" id="green"></div>
                <div class="btn purple" type="button" id="purple"></div>
            </div>
        </div>
    </div>

    <footer>Made with by Vashu</footer>

    <script src="script.js"></script>
</body>

</html>
